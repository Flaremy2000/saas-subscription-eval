services:
  db:
    image: postgres:15-alpine
    container_name: saas-subscription-db
    environment:
      POSTGRES_DB: saas_subscription
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: saas-subscription-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/saas_subscription
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "pnpm install --frozen-lockfile && pnpm db:generate && pnpm dev"

  frontend:
    build: ./frontend
    container_name: saas-subscription-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: /api/v1
      VITE_PROXY_TARGET: http://backend:3000
    volumes:
      - ./frontend/src:/app/src
      - frontend_node_modules:/app/node_modules
      - frontend_dist:/app/dist
    depends_on:
      - backend
    command: pnpm dev --host

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: saas-subscription-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_dist:
  pgadmin_data: